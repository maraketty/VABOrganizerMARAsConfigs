// Support for Comfortable Landing
// https://github.com/linuxgurugamer/Comfortable-Landing

ORGANIZERSUBCATEGORY
{
  name = airbags
  Label = #LOC_VABOrganizerComfortableLanding_subcategory_airbags
  Priority = 5
  CategoryPriority = 40
}

ORGANIZERSUBCATEGORY
{
  name = landingSkirts
  Label = #LOC_VABOrganizerComfortableLanding_subcategory_landingSkirts
  Priority = 5
  CategoryPriority = 40
}

ORGANIZERSUBCATEGORY
{
  name = retroRockets
  Label =  #LOC_VABOrganizerComfortableLanding_subcategory_retroRockets
  Priority = 5
  CategoryPriority = 40
}

ORGANIZERSUBCATEGORY
{
  name = buoys
  Label =  #LOC_VABOrganizerComfortableLanding_subcategory_buoy
  Priority = 5
  CategoryPriority = 40
}

// "AIGBAG" is not a typo *here*, that is how the part is titled in the
// ComfortableLanding mod.
@PART[UAM_AIGBAG*]:NEEDS[ComfortableLanding&VABOrganizer]:AFTER[ComfortableLanding]
{
  %VABORGANIZER
  {
    %organizerSubcategory = airbags
  }
}

@PART[UAM_SKIRT*]:NEEDS[ComfortableLanding&VABOrganizer]:AFTER[ComfortableLanding]
{
  %VABORGANIZER
  {
    %organizerSubcategory = landingSkirts
  }
}

@PART[UAM_ROCKET*]:NEEDS[ComfortableLanding&VABOrganizer]:AFTER[ComfortableLanding]
{
  %VABORGANIZER
  {
    %organizerSubcategory = retroRockets
  }
}

@PART[UAM_BUOY*]:NEEDS[ComfortableLanding&VABOrganizer]:AFTER[ComfortableLanding]
{
  %VABORGANIZER
  {
    %organizerSubcategory = buoys
  }
}

