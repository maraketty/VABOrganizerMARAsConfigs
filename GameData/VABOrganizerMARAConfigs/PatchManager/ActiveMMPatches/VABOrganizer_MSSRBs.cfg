// Support for Modular Segmented SRBs (MSSRBs)
// https://forum.kerbalspaceprogram.com/topic/188482-112x-modular-segmented-srbs/

ORGANIZERSUBCATEGORY
{
  name = srbMotors
  Label = #LOC_VABOrganizerMSSRB_subcategory_srbMotors // Modular Solid Engines
  Priority = 10
  CategoryPriority = 55
}

ORGANIZERSUBCATEGORY
{
  name = srbFuelSegments
  Label = #LOC_VABOrganizerMSSRB_subcategory_srbFuelSegments // Modular Solid Fuel
  Priority = 20
  CategoryPriority = 55
}

ORGANIZERSUBCATEGORY
{
  name = srbNoseCones
  Label =  #LOC_VABOrganizerMSSRB_subcategory_srbNoseCones // Modular Solid Endcaps
  Priority = 30
  CategoryPriority = 55
}

// The 0.625 Atlas and Minuteman motors do not contain "motor" in their part name which is why
// they are called out specifically using their full name.
@PART[MSSRB_*Motor*|MSSRB_Atlas_0625|MSSRB_Minuteman_0625]:NEEDS[ModularSegmentedSRBs&VABOrganizer]
{
  %VABORGANIZER
  {
    %organizerSubcategory = srbMotors
  }
}

@PART[MSSRB_Segment*]:NEEDS[ModularSegmentedSRBs&VABOrganizer]
{
  %VABORGANIZER
  {
    %organizerSubcategory = srbFuelSegments
  }
}

@PART[MSSRB_Nosecone*|MSSRB_EndCap*]:NEEDS[ModularSegmentedSRBs&VABOrganizer]
{
  %VABORGANIZER
  {
    %organizerSubcategory = srbNoseCones
  }
}